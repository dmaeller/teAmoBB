<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Ranking do Cocô 💩 | Em Breve</title>

  <!-- Tipografia Editorial do Projeto -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #FBF8F5;
      --card-bg: #FFFFFF;
      --primary: #5C061C;
      --primary-light: #8E1631;
      --accent-gold: #C5A059;
      --text-main: #2C2224;
      --text-muted: #7A6B6E;
      --shadow-soft: 0 10px 30px -5px rgba(92, 6, 28, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 30px 15px 100px;
      min-height: 100vh;
      background-image: radial-gradient(rgba(197, 160, 89, 0.12) 1px, transparent 1px);
      background-size: 24px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Player Flutuante de Música */
    .music-player {
      position: fixed;
      top: 15px;
      right: 15px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(197, 160, 89, 0.3);
      padding: 8px 14px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 99;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      cursor: pointer;
    }

    .music-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
    }

    .music-info {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--primary);
    }

    /* Cabeçalho */
    header {
      text-align: center;
      max-width: 600px;
      margin: 20px auto 40px;
      width: 100%;
    }

    .navbar {
      display: inline-flex;
      background: rgba(255, 255, 255, 0.7);
      padding: 4px;
      border-radius: 30px;
      border: 1px solid rgba(197, 160, 89, 0.25);
      margin-bottom: 25px;
      backdrop-filter: blur(8px);
      flex-wrap: wrap;
      justify-content: center;
    }

    .nav-link {
      padding: 8px 18px;
      border-radius: 20px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      transition: all 0.3s ease;
    }

    .nav-link.active {
      background: var(--primary);
      color: #FFF;
      box-shadow: 0 4px 12px rgba(92, 6, 28, 0.25);
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.5px;
      margin-bottom: 10px;
    }

    header p {
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    /* Card de Em Breve */
    .coming-soon-card {
      background: var(--card-bg);
      border: 1px solid rgba(197, 160, 89, 0.3);
      border-radius: 20px;
      padding: 50px 30px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: var(--shadow-soft);
      position: relative;
      overflow: hidden;
      margin-top: 10px;
    }

    .coming-soon-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, var(--primary), var(--accent-gold));
    }

    .emoji-badge {
      font-size: 3.5rem;
      margin-bottom: 15px;
      display: inline-block;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .coming-soon-tag {
      display: inline-block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--accent-gold);
      font-weight: 700;
      background: rgba(197, 160, 89, 0.12);
      padding: 6px 16px;
      border-radius: 20px;
      margin-bottom: 15px;
    }

    .coming-soon-card h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      color: var(--primary);
      margin-bottom: 12px;
    }

    .coming-soon-card p {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .handwritten-note {
      font-family: 'Caveat', cursive;
      font-size: 1.5rem;
      color: var(--primary-light);
      margin-top: 20px;
      border-top: 1px dashed rgba(197, 160, 89, 0.3);
      padding-top: 15px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--primary);
      color: #FFF;
      text-decoration: none;
      padding: 10px 24px;
      border-radius: 25px;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(92, 6, 28, 0.2);
    }

    .back-btn:hover {
      background: var(--primary-light);
      transform: translateY(-2deg);
    }
  </style>
</head>
<body>

  <!-- Trilha Sonora 
  <div class="music-player" onclick="toggleAudio()">
    <button class="music-btn" id="musicBtn">▶</button>
    <span class="music-info" id="musicTitle">Nossa Música 🎵</span>
    <audio id="bgAudio" loop src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>
  </div> -->

  <header>
    <nav class="navbar">
      <a href="index.html" class="nav-link">✉️ Motivos</a>
      <a href="album.html" class="nav-link">📸 Memórias</a>
      <a href="ranking.html" class="nav-link active">💩 Ranking</a>
    </nav>

    <h1>O Ranking Oficial</h1>
  </header>

  <main class="coming-soon-card">
    <div class="emoji-badge">💩🏆</div>
    <div>
      <span class="coming-soon-tag">Em Breve</span>
    </div>
    <h2>Página em Construção</h2>
    <p>Estamos preparando tudo.</p>

    <a href="album.html" class="back-btn">📸 Ver nosso Álbum enquanto isso</a>

    <div class="handwritten-note">
      Prometo que a classificação será justa!
    </div>
  </main>

  <script>
    function toggleAudio() {
      const audio = document.getElementById('bgAudio');
      const btn = document.getElementById('musicBtn');
      if (audio.paused) {
        audio.play();
        btn.innerText = "❚❚";
      } else {
        audio.pause();
        btn.innerText = "▶";
      }
    }
  </script>
</body>
</html>
