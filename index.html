<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>36 Motivos Para Te Amar ❤️</title>

  <!-- Fontes de Alta Tipografia -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --bg-color: #FBF8F5;
      --card-bg: #FFFFFF;
      --primary: #5C061C;
      --primary-light: #8E1631;
      --accent-gold: #C5A059;
      --text-main: #2C2224;
      --text-muted: #7A6B6E;
      --shadow-soft: 0 10px 30px -5px rgba(92, 6, 28, 0.08);
      --shadow-hover: 0 20px 40px -10px rgba(92, 6, 28, 0.22);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 30px 15px 100px;
      min-height: 100vh;
      background-image: radial-gradient(rgba(197, 160, 89, 0.12) 1px, transparent 1px);
      background-size: 24px 24px;
    }

    /* Player Flutuante de Música */
    .music-player {
      position: fixed;
      top: 15px;
      right: 15px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(197, 160, 89, 0.3);
      padding: 8px 14px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 99;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      cursor: pointer;
    }

    .music-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
    }

    .music-info {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--primary);
    }

    /* Cabeçalho */
    header {
      text-align: center;
      max-width: 600px;
      margin: 20px auto 40px;
    }

    .navbar {
      display: inline-flex;
      background: rgba(255, 255, 255, 0.7);
      padding: 4px;
      border-radius: 30px;
      border: 1px solid rgba(197, 160, 89, 0.25);
      margin-bottom: 25px;
      backdrop-filter: blur(8px);
    }

    .nav-link {
      padding: 8px 22px;
      border-radius: 20px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      transition: all 0.3s ease;
    }

    .nav-link.active {
      background: var(--primary);
      color: #FFF;
      box-shadow: 0 4px 12px rgba(92, 6, 28, 0.25);
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.6rem;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.5px;
      margin-bottom: 10px;
    }

    header p {
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .countdown-bar {
      margin-top: 15px;
      display: inline-block;
      font-size: 0.8rem;
      background: rgba(197, 160, 89, 0.12);
      color: #8C6A27;
      padding: 6px 16px;
      border-radius: 15px;
      font-weight: 600;
    }

    /* Baralho Organizado */
    .stack-container {
      max-width: 440px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }

    .card {
      background: var(--card-bg);
      border-radius: 18px;
      padding: 22px 28px;
      box-shadow: var(--shadow-soft);
      cursor: pointer;
      transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1);
      border: 1px solid rgba(197, 160, 89, 0.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }

    /* Efeito de rotação leve alternada para parecer um maço de verdade */
    .card:nth-child(odd) {
      transform: rotate(-0.8deg);
    }

    .card:nth-child(even) {
      transform: rotate(0.8deg);
    }

    .card+.card {
      margin-top: -38px;
    }

    .card:hover {
      transform: translateY(-22px) rotate(0deg) scale(1.03) !important;
      z-index: 999 !important;
      box-shadow: var(--shadow-hover);
      border-color: var(--accent-gold);
    }

    .card.locked {
      background: #F4EFEA;
      border-color: #E6DDD5;
      opacity: 0.9;
    }

    .card-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    /* Selo tipo Cera / Wax Seal */
    .wax-seal {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #A4133C, #5C061C);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFF;
      font-size: 0.85rem;
      box-shadow: 0 3px 8px rgba(92, 6, 28, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .card.locked .wax-seal {
      background: radial-gradient(circle at 30% 30%, #B0A3A5, #7A6B6E);
      box-shadow: none;
    }

    .card-number {
      font-family: 'Playfair Display', serif;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary);
    }

    .card.locked .card-number {
      color: var(--text-muted);
    }

    .card-tag {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent-gold);
    }

    /* Modal Carta */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(30, 15, 20, 0.6);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 10000;
    }

    .modal-content {
      background: #FFFDFB;
      border-radius: 24px;
      max-width: 520px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      padding: 35px 30px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
      position: relative;
      border: 1px solid var(--accent-gold);
      animation: modalUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes modalUp {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.95);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid rgba(0, 0, 0, 0.1);
      background: #FFF;
      cursor: pointer;
      font-size: 1.1rem;
      color: #888;
    }

    .modal-header {
      border-bottom: 1px solid rgba(197, 160, 89, 0.2);
      padding-bottom: 15px;
      margin-bottom: 20px;
    }

    .modal-subtitle {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--accent-gold);
      font-weight: 600;
    }

    .modal-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      color: var(--primary);
      margin-top: 4px;
    }

    .modal-body {
      font-size: 1.05rem;
      line-height: 1.7;
      color: #3B3032;
      white-space: pre-line;
    }

    .handwritten-footer {
      font-family: 'Caveat', cursive;
      font-size: 1.6rem;
      color: var(--primary-light);
      margin-top: 25px;
      text-align: right;
    }
  </style>
</head>

<body>

  <!-- Trilha Sonora do Casal 
  <div class="music-player" onclick="toggleAudio()">
    <button class="music-btn" id="musicBtn">▶</button>
    <span class="music-info" id="musicTitle">Nossa Música 🎵</span>
    <audio id="bgAudio" loop src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>
  </div>
-->
  <header>
    <nav class="navbar">
      <a href="index.html" class="nav-link active">✉️ Motivos</a>
      <a href="album.html" class="nav-link">📸 Memórias</a>
      <a href="ranking.html" class="nav-link">💩 Ranking</a>
    </nav>

    <h1>36 Motivos Para Te Amar</h1>
    <p>Uma coleção diária sobre o porquê escolho você há 3 anos.</p>
    <div class="countdown-bar" id="countdown">✨ Próximo motivo em breve</div>
  </header>

  <main class="stack-container" id="stack"></main>

  <!-- Modal da Carta -->
  <div class="modal-overlay" id="modal">
    <div class="modal-content">
      <button class="close-btn" onclick="fecharCarta()">&times;</button>
      <div class="modal-header">
        <span class="modal-subtitle" id="modalTag">Carta Diária</span>
        <h2 class="modal-title" id="modalTitle">Motivo #1</h2>
      </div>
      <div class="modal-body" id="modalBody">Conteúdo...</div>
      <div class="handwritten-footer">Com todo meu amor, eternamente.</div>
    </div>
  </div>

  <script>
    // 1. Data do Início das Cartas (Ano, Mês 0-11, Dia)
    const dataInicio = new Date(2026, 8, 12);

    // 2. Banco de Cartas / Motivos
    const cartas = [
      {
        dia: 1,
        titulo: "Do seu jeitinho",
        texto: "Dentre tantas motivações, dentre todos o que eu poderia falar, queria começar com uma coisa simples, seu jeitinho de ser. Uma pessoa que sempre diz ser simples e tem uma complexidade tão alta. Sou um amante do jeito que vc vive, do jeito que vc respira, do jeito que vc solta muitos puns... hehe, enfim, de todas as coisas que eu poderia ter no mundo, nada substituiria o jeito que vc é comigo. E eu amo muito isso."
      },
      {
        dia: 2,
        titulo: "Do carinho a mim",
        texto: "Certamente que deveria pensar/escrever sobre isso, já que é uma das coisas com mais peso pra mim. Amo o jeito que vc me trata e o tanto que se esforça pra cuidar de mim.  O carinho que vc tem pela minha pessoa me faz crer que realmente temos algo diferente. Ele é especial, aconchegante, me faz sentir bem mesmo estando bem mal. Isso também é válido para seu carinho físico, é claro. De quando seus dedinhos lindos e maravilhosos se entrelaçam no meu cabelo e dão um cafuné tão gostoso. Obrigado por ser tão carinhosa comigo. Ansioso pra ter seus carinhos novamente (dos que precisam estar presencialmente, é claro. Você com certeza continua demonstrando seu carinho mesmo de longe hehe.)"
      },
      {
        dia: 3,
        titulo: "Dos seus esforços",
        texto: "Das muitas coisas que me impressionam sobre você, com certeza, a forma que você sempre lidou com o nosso relacionamento foi algo incrível. Digo, sempre houveram esforços para uma manutenção, sempre tiveram atitudes para uma conservação do que temos. E você continua tentando, não é? Não é atoa que ainda não desistiu da gente e logo depois terminou tudo no momento difícil. Você sempre se demonstra presente, se demonstra afim disso.  E é muito aparente o resultado desses esforços 3 anos depois. E tipo me perdoe a expressão, mas caralho, 3 anos já? Mo cota que eu te amo."
      },
      {
        dia: 4,
        titulo: "Do seu sorriso",
        texto: "Se todos os meus dias tivessem o seu sorriso... Se todo o mundo pudesse sentir a alegria de te ver sorrir... Acho que o mundo seria um lugar melhor. É simplesmente único e maravilhoso o jeito em que você demonstra sua felicidade, o jeito como você transparece tanta beleza em um sorriso só. Não sei se seria errado dizer que você ama uma pessoa pelo jeito que ela sorri, mas sei que é errado não te amar pelo seu sorriso. Quero preservar esse sorriso pra sempre, pois, além de lindo, é um ponto que me conforta de todas as tristezas e angústias da vida."
      },
      {
        dia: 5,
        titulo: "Das suas lágrimas",
        texto: "Pensei sobre a outra carta e sobre o quanto te ver sorrir me chama atenção, mas como tudo na vida tem um contraponto, também existem momentos que choramos. Sempre pensei sobre o fato de que ver alguém chorar é algo horrível, e quase sempre de fato é, mas você chora com tanta vontade, com tanta emoção, que de certa forma encontro uma certa beleza nisso. Chorar não é sinal de fraqueza, é sinal de uma luta, é um sinal de algo forte o bastante para comover alguém a ponto de demonstrar o ápice da sua emoção. E vejo o quanto chora pelos mais variáveis motivos, seja por algo realmente triste, seja por um momento emocionante num filme de criança ou até por ficar 3 meses fisicamente longe de mim e de todos que ama. O fato de você derramar lágrimas de uma maneira tão sincera é realmente um bom sinal pra mim. Demonstração de alguém que é realmente humana, que não perdeu sua essência em meio a um mundo tão apático. Acho que isso é exatamente quem eu quero ao meu lado, não só hoje, mas também para construir um futuro todo juntos. Você é a mulher com o choro mais lindo do mundo e esse é só mais um dos inúmeros motivos pelos quais eu te amo."
      },
      {
        dia: 36,
        titulo: "Eu escolheria tudo de novo",
        texto: "Mesmo depois de mais de mil dias, a minha resposta para 'você tem certeza?' continua sendo a mesma: certeza absoluta."
      }
    ];

    // Cálculo do dia atual
    const hoje = new Date();
    hoje.setHours(0, 0, 0, 0);
    dataInicio.setHours(0, 0, 0, 0);

    const diferencaTempo = hoje - dataInicio;
    const diasPassados = Math.max(1, Math.floor(diferencaTempo / (1000 * 60 * 60 * 24)) + 1);

    const totalCartas = 36;
    const stack = document.getElementById('stack');

    for (let i = 1; i <= totalCartas; i++) {
      const estaLiberado = i <= diasPassados;
      const cartaExistente = cartas.find(c => c.dia === i);

      const titulo = cartaExistente ? cartaExistente.titulo : `Motivo #${i}`;
      const texto = cartaExistente ? cartaExistente.texto : `Escreva aqui o motivo número ${i}...`;

      const card = document.createElement('div');
      card.className = `card ${estaLiberado ? 'unlocked' : 'locked'}`;
      card.style.zIndex = totalCartas - i; // Faz o topo sobrepor o fundo suavemente

      if (estaLiberado) {
        card.innerHTML = `
          <div class="card-left">
            <div class="wax-seal">♥</div>
            <div class="card-number">Motivo #${i}</div>
          </div>
          <span class="card-tag">Ler Carta</span>
        `;
        card.onclick = () => abrirCarta(`MOTIVO #${i}`, titulo, texto);
      } else {
        const dataLiberacao = new Date(dataInicio);
        dataLiberacao.setDate(dataInicio.getDate() + (i - 1));
        const dataFormatada = dataLiberacao.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });

        card.innerHTML = `
          <div class="card-left">
            <div class="wax-seal">🔒</div>
            <div class="card-number">Motivo #${i}</div>
          </div>
          <span class="card-tag" style="color:#A09395">${dataFormatada}</span>
        `;
        card.onclick = () => abrirCarta("CARTA BLOQUEADA", "Ainda não!", `Esta carta só será destravada no dia ${dataFormatada}. Volte depois para ler! ❤️`);
      }

      stack.appendChild(card);
    }

    function abrirCarta(tag, titulo, texto) {
      document.getElementById('modalTag').innerText = tag;
      document.getElementById('modalTitle').innerText = titulo;
      document.getElementById('modalBody').innerText = texto;
      document.getElementById('modal').style.display = 'flex';
    }

    function fecharCarta() {
      document.getElementById('modal').style.display = 'none';
    }

    // Cronômetro para a meia-noite
    function atualizarCronometro() {
      const agora = new Date();
      const meiaNoite = new Date();
      meiaNoite.setHours(24, 0, 0, 0);

      const diff = meiaNoite - agora;
      const horas = Math.floor(diff / (1000 * 60 * 60));
      const minutos = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));

      document.getElementById('countdown').innerText = `⏳ Próximo motivo destrava em ${horas}h ${minutos}m`;
    }
    setInterval(atualizarCronometro, 60000);
    atualizarCronometro();

    // Controle do Player de Áudio
    function toggleAudio() {
      const audio = document.getElementById('bgAudio');
      const btn = document.getElementById('musicBtn');
      if (audio.paused) {
        audio.play();
        btn.innerText = "❚❚";
      } else {
        audio.pause();
        btn.innerText = "▶";
      }
    }
  </script>
</body>

</html>
