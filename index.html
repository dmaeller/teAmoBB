<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Impede que o Google e outros buscadores indexem esta página -->
  <meta name="robots" content="noindex, nofollow">
  <title>Aviso</title>
  <style>
    /* Remove margens padrão e garante que o corpo ocupe 100% da altura da tela */
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center; /* Centraliza na horizontal */
      align-items: center;     /* Centraliza na vertical */
      background-color: #0f0f0f; /* Fundo escuro simples (pode alterar a cor se preferir) */
      color: #ffffff;          /* Cor da letra branca */
      font-family: Arial, sans-serif;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: normal;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>

  <h1>Você não deveria estar lendo isso</h1>

</body>
</html>
